name: Rastreo de procesos judiciales

# Se ejecuta 2 veces al día (hora Colombia = UTC-5):
#   11:00 UTC = 6:00 a.m.  ·  22:00 UTC = 5:00 p.m.
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

jobs:
  rastrear-y-notificar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CENTRAL: ${{ secrets.EMAIL_CENTRAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          cd worker && npm install --no-audit --no-fund
          cd ../notify && npm install --no-audit --no-fund

      - name: Rastrear procesos (detecta actuaciones nuevas -> alertas)
        run: cd worker && node rastrear.mjs

      - name: Notificar alertas pendientes por correo
        run: cd notify && node notificar.mjs
