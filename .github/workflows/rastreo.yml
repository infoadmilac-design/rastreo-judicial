name: Rastreo de procesos judiciales

# Se ejecuta 2 veces al día (hora Colombia = UTC-5):
#   12:07 UTC = 7:07 a.m.  ·  17:37 UTC = 12:37 p.m.
# Una corrida completa tarda ~2 h (hay ~200 procesos rastreables y se hacen pausas
# para no bloquear el servidor de la Rama), así que la 2ª sale a mediodía para
# terminar ~3 p. m. y que el informe diario de las 6:00 p. m. (informe.yml) incluya
# todo lo del día. Los minutos "raros" (:07, :37) evitan la congestión de GitHub en
# las horas en punto, donde los disparos llegaron a atrasarse varias horas.
on:
  schedule:
    - cron: '7 12 * * *'
    - cron: '37 17 * * *'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions o el dashboard

# Si una corrida se atrasa, la siguiente espera su turno en vez de correr encima.
concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear-y-notificar:
    runs-on: ubuntu-latest
    # Con el ritmo seguro (pausas 3-5min para no bloquear el servidor de la Rama,
    # ver docs/api-cpnu.md) ~200 procesos tardan ~2 h.
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CENTRAL: ${{ secrets.EMAIL_CENTRAL }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      WHATSAPP_LANG: ${{ secrets.WHATSAPP_LANG }}
      WHATSAPP_CENTRAL: ${{ secrets.WHATSAPP_CENTRAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          cd worker && npm install --no-audit --no-fund
          cd ../notify && npm install --no-audit --no-fund

      - name: Rastrear procesos (detecta actuaciones nuevas -> alertas)
        run: cd worker && node rastrear.mjs

      - name: Revisar Publicaciones Procesales (Zipaquira/Cogua, no tienen API)
        # continue-on-error: si el portal cambia de estructura o falla, no debe
        # tumbar el resto de la corrida (que ya quedó guardada en Supabase).
        continue-on-error: true
        run: cd worker && node publicaciones-procesales.mjs

      - name: Notificar alertas pendientes (correo + WhatsApp)
        # continue-on-error: si falta configurar algún secreto, este paso no debe
        # tumbar el rastreo (que ya quedó guardado en Supabase).
        continue-on-error: true
        run: cd notify && node notificar.mjs

      - name: Enviar informe de la corrida por WhatsApp
        continue-on-error: true
        run: cd worker && node resumen-corrida.mjs
