name: Informe diario (6:00 p. m.) y semanal (viernes 6:30 p. m.)

# Horas en Colombia (UTC-5). GitHub Actions suele atrasar los disparos, y más
# los que caen justo en punto, así que cada informe se dispara ~13-15 min antes
# en un minuto "raro" y el script ESPERA hasta la hora exacta (ESPERAR_HASTA)
# antes de generar y enviar el PDF:
#   22:47 UTC = 5:47 p. m. -> informe DIARIO a las 6:00 p. m. (todos los dias)
#   23:17 UTC = 6:17 p. m. -> informe SEMANAL a las 6:30 p. m. (solo viernes: lunes a viernes)
# Las revisiones de procesos (rastreo.yml) corren a las 7:07 a. m. y 12:37 p. m. para
# terminar bastante antes de las 6 p. m. y que el informe incluya todo lo del dia.
on:
  schedule:
    - cron: '47 22 * * *'
    - cron: '17 23 * * 5'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Qué informe generar ahora mismo (sin esperar la hora)'
        type: choice
        default: auto
        options: [auto, diario, semanal]

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      WHATSAPP_LANG: ${{ secrets.WHATSAPP_LANG }}
      WHATSAPP_CENTRAL: ${{ secrets.WHATSAPP_CENTRAL }}
      # Disparo programado: el cron decide cual informe es y a que hora se envia.
      MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.tipo || (github.event.schedule == '17 23 * * 5' && 'semanal' || 'diario') }}
      ESPERAR_HASTA: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 23 * * 5' && '18:30' || '18:00') || '' }}
      # Si el informe de ese día ya salió (p. ej. por disparo puntual), el cron tardío no lo repite.
      OMITIR_SI_YA_ENVIADO: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          cd worker && npm install --no-audit --no-fund
          cd ../notify && npm install --no-audit --no-fund

      - name: Generar y enviar el informe por WhatsApp
        run: cd worker && node informe.mjs "$MODO"
