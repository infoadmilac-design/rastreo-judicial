name: Informe diario y semanal (viernes)

# Corre 1 vez al dia, ya terminadas las corridas de rastreo de 10am y 4pm:
#   00:00 UTC = 7:00 p.m. hora Colombia (mismo dia, con margen de sobra).
# Los viernes ademas manda el informe semanal (lunes a viernes).
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:        # permite correrlo a mano desde la pestana Actions

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      WHATSAPP_LANG: ${{ secrets.WHATSAPP_LANG }}
      WHATSAPP_CENTRAL: ${{ secrets.WHATSAPP_CENTRAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          cd worker && npm install --no-audit --no-fund
          cd ../notify && npm install --no-audit --no-fund

      - name: Generar y enviar informe(s) por WhatsApp
        run: cd worker && node informe.mjs
